<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>SMA MAP ROAD</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f5f7;
    color: #1f2937;
}

header {
    background: #142f44;
    color: white;
    padding: 14px 20px;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 5px 0 0;
    color: #cdd9e3;
}


/* ===========================
   ВЕРХНЯЯ СТАТИСТИКА
=========================== */

#topbar {

    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;

    padding: 10px 20px;

    background: white;

    border-bottom: 1px solid #ddd;
}

.stat {

    padding: 8px 12px;

    background: #eef2f6;

    border-radius: 8px;

    font-weight: bold;
}

.stat span {
    color: #126caa;
}

#syncStatus {

    margin-left: auto;

    font-size: 13px;

    font-weight: bold;
}


/* ===========================
   ОСНОВНОЙ LAYOUT
=========================== */

.layout {

    display: grid;

    grid-template-columns:
        360px 1fr;

    height:
        calc(100vh - 125px);
}


/* ===========================
   ЛЕВАЯ ПАНЕЛЬ
=========================== */

.sidebar {

    display: flex;

    flex-direction: column;

    background: white;

    border-right: 1px solid #ddd;

    overflow: hidden;
}

.sidebar-controls {

    padding: 12px;

    border-bottom: 1px solid #ddd;
}

input,
select,
textarea {

    width: 100%;

    padding: 10px;

    border: 1px solid #cbd5e1;

    border-radius: 6px;

    font-size: 14px;

    font-family: Arial, sans-serif;
}

.gap {
    margin-top: 8px;
}

#stopList {

    flex: 1;

    overflow-y: auto;
}


/* ===========================
   КАРТОЧКИ В СПИСКЕ
=========================== */

.stop-item {

    display: block;

    width: 100%;

    padding: 12px;

    border: none;

    border-bottom: 1px solid #eee;

    background: white;

    text-align: left;

    cursor: pointer;
}

.stop-item:hover {
    background: #f5f7fa;
}

.stop-item.active {

    background: #e9f3fb;

    border-left: 5px solid #126caa;
}

.stop-name {

    font-weight: bold;

    margin-bottom: 5px;
}

.stop-routes {

    font-size: 12px;

    color: #64748b;
}


/* ===========================
   СТАТУСЫ
=========================== */

.status {

    display: inline-block;

    margin-top: 7px;

    padding: 4px 8px;

    border-radius: 12px;

    font-size: 11px;

    font-weight: bold;
}

.status-source {

    background: #dceeff;

    color: #075985;
}

.status-verified {

    background: #d9f5df;

    color: #146c2e;
}

.status-pending {

    background: #eee9f6;

    color: #5b5170;
}

.status-problem {

    background: #ffe1e1;

    color: #9a2424;
}


/* ===========================
   ПРАВАЯ ЧАСТЬ
=========================== */

.main {

    display: grid;

    grid-template-rows:
        minmax(400px, 1fr)
        auto;

    overflow: hidden;
}

#map {

    width: 100%;

    height: 100%;
}


/* ===========================
   НИЖНЯЯ ПАНЕЛЬ
=========================== */

.verification-panel {

    background: white;

    border-top: 1px solid #ddd;

    padding: 15px 18px;

    max-height: 47vh;

    overflow-y: auto;
}

.panel-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;
}

.panel-header h2 {
    margin: 0 0 5px;
}

#currentStatus {
    font-weight: bold;
}


/* ===========================
   ИНФОРМАЦИЯ
=========================== */

.info-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    margin-top: 12px;
}

.info-box {

    padding: 10px;

    background: #f4f6f8;

    border-radius: 7px;
}

.info-title {

    margin-bottom: 4px;

    font-size: 11px;

    color: #64748b;
}


/* ===========================
   КООРДИНАТЫ
=========================== */

.coordinate-row {

    display: grid;

    grid-template-columns:
        1fr 150px;

    gap: 10px;

    margin-top: 12px;
}

.reviewer-row {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-top: 10px;
}


/* ===========================
   СРАВНЕНИЕ КООРДИНАТ
=========================== */

#compareInfo {

    display: none;

    margin-top: 9px;

    padding: 10px 12px;

    border-radius: 7px;

    font-weight: bold;

    line-height: 1.5;
}


/* ===========================
   КНОПКИ
=========================== */

.actions {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-top: 12px;
}

button {

    border: none;

    border-radius: 6px;

    padding: 10px 14px;

    cursor: pointer;

    font-weight: bold;
}

button:disabled {

    opacity: 0.5;

    cursor: not-allowed;
}

.btn-blue {
    background: #126caa;
    color: white;
}

.btn-green {
    background: #198754;
    color: white;
}

.btn-red {
    background: #dc3545;
    color: white;
}

.btn-dark {
    background: #1f2937;
    color: white;
}

.btn-gray {
    background: #e5e7eb;
}


/* ===========================
   2ГИС
=========================== */

.source-link {

    display: inline-block;

    padding: 10px 13px;

    background: #126caa;

    color: white;

    border-radius: 6px;

    text-decoration: none;

    font-weight: bold;

    white-space: nowrap;
}


/* ===========================
   СООБЩЕНИЯ
=========================== */

.message {

    display: none;

    margin-top: 10px;

    padding: 10px;

    border-radius: 6px;
}

.message.ok {

    display: block;

    background: #dff6e4;

    color: #146c2e;
}

.message.error {

    display: block;

    background: #ffe0e0;

    color: #9a2424;
}


/* ===========================
   ЦИФРА МАРШРУТОВ НА ТОЧКЕ
=========================== */

.route-count-label {

    background: white;

    border: 2px solid #333;

    border-radius: 18px;

    padding: 2px 7px;

    font-weight: bold;
}


/* ===========================
   MOBILE
=========================== */

@media (max-width: 900px) {

    .layout {

        grid-template-columns: 1fr;

        height: auto;
    }

    .sidebar {
        height: 350px;
    }

    .main {
        height: 900px;
    }

    .info-grid,
    .coordinate-row,
    .reviewer-row {

        grid-template-columns: 1fr;
    }

    #syncStatus {

        width: 100%;

        margin-left: 0;
    }

}

</style>

</head>


<body>


<header>

    <h1>
        SMA MAP ROAD
    </h1>

    <p>
        Проверка отстоев Алматы
    </p>

</header>


<!-- ===========================
     СТАТИСТИКА
=========================== -->

<div id="topbar">

    <div class="stat">

        Всего:

        <span id="totalCount">
            0
        </span>

    </div>


    <div class="stat">

        🟢 Проверено:

        <span id="verifiedCount">
            0
        </span>

    </div>


    <div class="stat">

        🔵 Есть координата:

        <span id="sourceCount">
            0
        </span>

    </div>


    <div class="stat">

        ⚪ Без координат:

        <span id="pendingCount">
            0
        </span>

    </div>


    <div class="stat">

        🔴 Проблема:

        <span id="problemCount">
            0
        </span>

    </div>


    <button
        id="refreshButton"
        class="btn-gray"
    >
        ↻ Обновить
    </button>


    <div id="syncStatus">

        Подключение...

    </div>

</div>



<div class="layout">


<!-- ===========================
     ЛЕВАЯ ПАНЕЛЬ
=========================== -->

<aside class="sidebar">


    <div class="sidebar-controls">


        <input
            id="searchInput"
            placeholder="Маршрут, отстой или автопарк"
        >


        <select
            id="statusFilter"
            class="gap"
        >

            <option value="ALL">
                Все
            </option>

            <option value="ПРОВЕРЕНО">
                🟢 Проверено
            </option>

            <option value="ЕСТЬ КООРДИНАТА">
                🔵 Есть координата
            </option>

            <option value="НЕ ПРОВЕРЕНО">
                ⚪ Без координат
            </option>

            <option value="ПРОБЛЕМА">
                🔴 Проблема
            </option>

        </select>


        <button
            id="nextButton"
            class="btn-dark gap"
            style="width:100%"
        >
            Следующий на проверку →
        </button>


    </div>


    <div id="stopList">
    </div>


</aside>



<!-- ===========================
     ПРАВАЯ ЧАСТЬ
=========================== -->

<main class="main">


    <div id="map">
    </div>



    <section class="verification-panel">


        <div class="panel-header">


            <div>

                <h2 id="currentName">
                    Выберите отстой
                </h2>

                <div id="currentStatus">
                    —
                </div>

            </div>


            <a
                id="sourceLink"
                class="source-link"
                href="#"
                target="_blank"
                rel="noopener"
            >
                🌐 Открыть 2ГИС
            </a>


        </div>



        <div class="info-grid">


            <div class="info-box">

                <div class="info-title">
                    Маршруты
                </div>

                <div id="currentRoutes">
                    —
                </div>

            </div>


            <div class="info-box">

                <div class="info-title">
                    Автопарк
                </div>

                <div id="currentParks">
                    —
                </div>

            </div>

        <div class="coordinate-row">


            <input
                id="coordinateInput"
                placeholder="Вставь координаты или полный URL 2ГИС"
            >

                id="showButton"

            >
                📍 Показать
            </button>


        </div>



        <div id="compareInfo">
        </div>



        <div class="reviewer-row">


            <input
                id="reviewerInput"
                placeholder="Кто проверяет?"
            >


            <input
                id="noteInput"
                placeholder="Примечание"
            >


        </div>



        <div class="actions">


            <button
                id="confirmButton"
                class="btn-green"
            >
                ✅ Подтвердить
            </button>


            <button
                id="problemButton"
                class="btn-red"
            >
                ❌ Проблема
            </button>

        </div>

</main>


</div>



<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script src="stops.js"></script>


<script>


// ============================================================
// GOOGLE APPS SCRIPT API
// ============================================================

const API_URL =
    "https://script.google.com/macros/s/AKfycbxUb1Q2kPAQOTewzBmvnszc_EmLAQ0pLEsNYb1NAxTkcOrESwhNWtSH-uIatxIkGE5j/exec";



// ============================================================
// КАРТА
// ============================================================

const map =

    L.map("map").setView(

        [
            43.238949,
            76.889709
        ],

        11

    );



L.tileLayer(

    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",

    {

        maxZoom: 19,

        attribution: "Esri"

    }

).addTo(map);



// ============================================================
// СЛОИ
// ============================================================

const sourceLayer =
    L.layerGroup().addTo(map);


const verifiedLayer =
    L.layerGroup().addTo(map);


const problemLayer =
    L.layerGroup().addTo(map);


const candidateLayer =
    L.layerGroup().addTo(map);



L.control.layers(

    {},

    {

        "🔵 Старые координаты":
            sourceLayer,

        "🟢 Проверенные":
            verifiedLayer,

        "🔴 Проблемные":
            problemLayer,

        "🟠 Новая точка":
            candidateLayer

    }

).addTo(map);



// ============================================================
// ДАННЫЕ
// ============================================================

let records =
    new Map();


let activeStop =
    null;


let candidate =
    null;


let saving =
    false;



// ============================================================
// ПРОВЕРКА СТАРЫХ КООРДИНАТ STOPS.JS
// ============================================================

function hasSourceCoordinates(stop) {

    return (

        stop.lat !== null &&
        stop.lon !== null &&

        Number.isFinite(
            Number(stop.lat)
        ) &&

        Number.isFinite(
            Number(stop.lon)
        )

    );
}



// ============================================================
// ВАЛИДАЦИЯ КООРДИНАТ
// ============================================================

function validCoordinates(
    lat,
    lon
) {

    return (

        Number.isFinite(lat) &&
        Number.isFinite(lon) &&

        lat >= 42 &&
        lat <= 45 &&

        lon >= 75 &&
        lon <= 80

    );
}



// ============================================================
// ID ОТСТОЯ
// ============================================================

function makeStopId(
    stop,
    index
) {

    if (stop.url) {

        const match =

            stop.url.match(

                /go\.2gis\.com\/([^/?#]+)/i

            );


        if (match) {

            return (
                "2GIS-" +
                match[1]
            );
        }
    }


    const text =

        [

            stop.url || "",

            stop.name || "",

            (
                stop.routes ||
                []
            ).join(","),

            index

        ].join("|");


    let hash =
        2166136261;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        hash ^=
            text.charCodeAt(i);


        hash =
            Math.imul(

                hash,
                16777619

            );
    }


    return (

        "STOP-" +

        (
            hash >>> 0
        ).toString(16)

    );
}



// ============================================================
// НОРМАЛИЗАЦИЯ STOPS.JS
// ============================================================

const allStops =

    stops.map(

        function(
            stop,
            index
        ) {

            return {

                ...stop,

                id:
                    makeStopId(
                        stop,
                        index
                    ),

                index:
                    index

            };

        }

    );



// ============================================================
// ПОЛУЧИТЬ ЗАПИСЬ
// ============================================================

function getRecord(stop) {

    return (
        records.get(
            stop.id
        ) || null
    );
}



// ============================================================
// ПОЛУЧИТЬ ТЕКУЩУЮ ИЗВЕСТНУЮ КООРДИНАТУ
//
// ПРИОРИТЕТ:
// 1. GOOGLE SHEETS
// 2. STOPS.JS
// ============================================================

function getExistingCoordinates(stop) {

    const record =
        getRecord(stop);


    if (
        record &&
        validCoordinates(

            Number(record.lat),
            Number(record.lon)

        )
    ) {

        return {

            lat:
                Number(record.lat),

            lon:
                Number(record.lon),

            source:
                "record"

        };
    }


    if (
        hasSourceCoordinates(stop)
    ) {

        return {

            lat:
                Number(stop.lat),

            lon:
                Number(stop.lon),

            source:
                "stops"

        };
    }


    return null;
}



// ============================================================
// СТАТУС
// ============================================================

function getStatus(stop) {

    const record =
        getRecord(stop);


    if (
        record &&
        record.status === "ПРОВЕРЕНО"
    ) {

        return "ПРОВЕРЕНО";
    }


    if (
        record &&
        record.status === "ПРОБЛЕМА"
    ) {

        return "ПРОБЛЕМА";
    }


    if (
        hasSourceCoordinates(stop)
    ) {

        return "ЕСТЬ КООРДИНАТА";
    }


    return "НЕ ПРОВЕРЕНО";
}



// ============================================================
// ЗАГРУЗКА GOOGLE SHEETS
// ============================================================

async function loadRecords() {

    setSyncStatus(
        "Синхронизация..."
    );


    try {

        const response =

            await fetch(

                API_URL +

                "?action=list&t=" +

                Date.now(),

                {
                    cache:
                        "no-store"
                }

            );


        const data =
            await response.json();


        if (!data.ok) {

            throw new Error(

                data.error ||
                "Ошибка API"

            );
        }


        records =
            new Map();


        (
            data.records ||
            []
        ).forEach(

            function(record) {

                records.set(

                    String(record.id),

                    record

                );

            }

        );


        renderEverything();


        setSyncStatus(
            "● Синхронизировано"
        );

    }

    catch (error) {

        console.error(error);


        setSyncStatus(
            "⚠ Нет связи"
        );


        showMessage(

            "Ошибка подключения: " +
            error.message,

            "error"

        );
    }
}



// ============================================================
// СОХРАНЕНИЕ
// ============================================================

async function sendRecord(record) {

    if (saving) {
        return;
    }


    saving = true;


    setButtonsDisabled(
        true
    );


    setSyncStatus(
        "Сохранение..."
    );


    try {

        const response =

            await fetch(

                API_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:

                        JSON.stringify({

                            action:
                                "save",

                            record:
                                record

                        })

                }

            );


        const data =
            await response.json();


        if (!data.ok) {

            throw new Error(

                data.error ||
                "Ошибка сохранения"

            );
        }


        records.set(

            String(
                data.record.id
            ),

            data.record

        );


        setSyncStatus(
            "● Сохранено"
        );


        return data.record;

    }

    finally {

        saving = false;


        setButtonsDisabled(
            false
        );
    }
}



// ============================================================
// КНОПКИ
// ============================================================

function setButtonsDisabled(value) {

    document
        .getElementById(
            "confirmButton"
        )
        .disabled =
            value;


    document
        .getElementById(
            "problemButton"
        )
        .disabled =
            value;
}



// ============================================================
// SYNC
// ============================================================

function setSyncStatus(text) {

    document
        .getElementById(
            "syncStatus"
        )
        .textContent =
            text;
}



// ============================================================
// СТАТИСТИКА
// ============================================================

function renderStats() {

    let verified = 0;
    let source = 0;
    let pending = 0;
    let problem = 0;


    allStops.forEach(

        function(stop) {

            const status =
                getStatus(stop);


            if (
                status === "ПРОВЕРЕНО"
            ) {

                verified++;

            }

            else if (
                status === "ЕСТЬ КООРДИНАТА"
            ) {

                source++;

            }

            else if (
                status === "ПРОБЛЕМА"
            ) {

                problem++;

            }

            else {

                pending++;

            }

        }

    );


    document
        .getElementById(
            "totalCount"
        )
        .textContent =
            allStops.length;


    document
        .getElementById(
            "verifiedCount"
        )
        .textContent =
            verified;


    document
        .getElementById(
            "sourceCount"
        )
        .textContent =
            source;


    document
        .getElementById(
            "pendingCount"
        )
        .textContent =
            pending;


    document
        .getElementById(
            "problemCount"
        )
        .textContent =
            problem;
}



// ============================================================
// СПИСОК
// ============================================================

function renderStopList() {

    const list =

        document.getElementById(
            "stopList"
        );


    list.innerHTML = "";


    const search =

        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    const filter =

        document
            .getElementById(
                "statusFilter"
            )
            .value;


    const filtered =

        allStops.filter(

            function(stop) {

                const status =
                    getStatus(stop);


                if (
                    filter !== "ALL" &&
                    status !== filter
                ) {

                    return false;
                }


                if (!search) {
                    return true;
                }


                const text =

                    [

                        stop.name || "",

                        (
                            stop.routes ||
                            []
                        ).join(" "),

                        (
                            stop.parks ||
                            []
                        ).join(" ")

                    ]

                    .join(" ")
                    .toLowerCase();


                return (
                    text.includes(search)
                );
            }

        );


    filtered.forEach(

        function(stop) {

            const button =

                document.createElement(
                    "button"
                );


            button.className =
                "stop-item";


            if (
                activeStop &&
                activeStop.id === stop.id
            ) {

                button.classList.add(
                    "active"
                );
            }


            const name =

                document.createElement(
                    "div"
                );


            name.className =
                "stop-name";


            name.textContent =
                stop.name;


            const routes =

                document.createElement(
                    "div"
                );


            routes.className =
                "stop-routes";


            routes.textContent =

                "Маршруты: " +

                (
                    stop.routes ||
                    []
                ).join(", ");


            const badge =

                document.createElement(
                    "span"
                );


            badge.className =
                "status";


            const status =
                getStatus(stop);


            if (
                status === "ПРОВЕРЕНО"
            ) {

                badge.classList.add(
                    "status-verified"
                );


                badge.textContent =
                    "🟢 ПРОВЕРЕНО";
            }

            else if (
                status === "ЕСТЬ КООРДИНАТА"
            ) {

                badge.classList.add(
                    "status-source"
                );


                badge.textContent =
                    "🔵 ЕСТЬ КООРДИНАТА";
            }

            else if (
                status === "ПРОБЛЕМА"
            ) {

                badge.classList.add(
                    "status-problem"
                );


                badge.textContent =
                    "🔴 ПРОБЛЕМА";
            }

            else {

                badge.classList.add(
                    "status-pending"
                );


                badge.textContent =
                    "⚪ БЕЗ КООРДИНАТ";
            }


            button.appendChild(name);

            button.appendChild(routes);

            button.appendChild(badge);


            button.onclick =
                function() {

                    selectStop(
                        stop.id
                    );

                };


            list.appendChild(button);
        }

    );
}



// ============================================================
// ВЫБОР ОТСТОЯ
// ============================================================

function selectStop(id) {

    activeStop =

        allStops.find(

            stop =>
                stop.id === id

        );


    candidate = null;


    candidateLayer
        .clearLayers();


    clearCompare();


    renderCurrentStop();


    renderStopList();
}

// ============================================================
// ПАРСИНГ КООРДИНАТ
// ============================================================

function parseCoordinates(text) {

    if (!text) {
        return null;
    }


    let value =
        text.trim();


    try {

        value =
            decodeURIComponent(
                value
            );

    }

    catch (error) {
    }


    // =====================================
    // 2GIS ?m=76.123456,43.123456
    // =====================================

    const mapMatch =

        value.match(

            /[?&]m=(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/i

        );


    if (mapMatch) {

        const lon =
            Number(mapMatch[1]);


        const lat =
            Number(mapMatch[2]);


        if (
            validCoordinates(
                lat,
                lon
            )
        ) {

            return {
                lat,
                lon
            };
        }
    }


    // =====================================
    // 2GIS /geo/76.123,43.123
    // =====================================

    const geoMatch =

        value.match(

            /\/geo\/(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/i

        );


    if (geoMatch) {

        const lon =
            Number(geoMatch[1]);


        const lat =
            Number(geoMatch[2]);


        if (
            validCoordinates(
                lat,
                lon
            )
        ) {

            return {
                lat,
                lon
            };
        }
    }


    // =====================================
    // ОБЫЧНЫЕ КООРДИНАТЫ
    // =====================================

    const simpleMatch =

        value.match(

            /(-?\d{2,3}(?:\.\d+)?)[,\s;]+(-?\d{2,3}(?:\.\d+)?)/

        );


    if (!simpleMatch) {

        return null;
    }


    const a =
        Number(simpleMatch[1]);


    const b =
        Number(simpleMatch[2]);


    // longitude, latitude

    if (
        a >= 75 &&
        a <= 80 &&

        b >= 42 &&
        b <= 45
    ) {

        return {

            lat: b,

            lon: a

        };
    }


    // latitude, longitude

    if (
        a >= 42 &&
        a <= 45 &&

        b >= 75 &&
        b <= 80
    ) {

        return {

            lat: a,

            lon: b

        };
    }


    return null;
}



// ============================================================
// РАССТОЯНИЕ В МЕТРАХ
// ============================================================

function distanceMeters(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371000;


    const toRad =
        value =>
            value *
            Math.PI /
            180;


    const dLat =
        toRad(
            lat2 - lat1
        );


    const dLon =
        toRad(
            lon2 - lon1
        );


    const a =

        Math.sin(
            dLat / 2
        ) ** 2 +

        Math.cos(
            toRad(lat1)
        ) *

        Math.cos(
            toRad(lat2)
        ) *

        Math.sin(
            dLon / 2
        ) ** 2;


    const c =

        2 *

        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1 - a)

        );


    return (
        R * c
    );
}



// ============================================================
// СБРОС СРАВНЕНИЯ
// ============================================================

function clearCompare() {

    const element =

        document.getElementById(
            "compareInfo"
        );


    element.style.display =
        "none";


    element.innerHTML =
        "";
}



// ============================================================
// ПОКАЗАТЬ НОВУЮ КООРДИНАТУ
// ============================================================

function showCandidate() {

    if (!activeStop) {

        showMessage(

            "Сначала выберите отстой.",

            "error"

        );

        return;
    }


    const input =

        document
            .getElementById(
                "coordinateInput"
            )
            .value;


    const parsed =
        parseCoordinates(input);


    if (!parsed) {

        showMessage(

            "Не понял координаты. Вставь полный URL из адресной строки 2ГИС или координаты вида 76.123456, 43.123456.",

            "error"

        );

        return;
    }


    candidate =
        parsed;


    candidateLayer
        .clearLayers();


    const marker =

        L.circleMarker(

            [
                parsed.lat,
                parsed.lon
            ],

            {

                radius: 12,

                color: "#ffffff",

                weight: 3,

                fillColor: "#ff8c00",

                fillOpacity: 1

            }

        )

        .addTo(
            candidateLayer
        );


    marker.bindPopup(

        "<b>" +

        activeStop.name +

        "</b>" +

        "<br><br>" +

        "🟠 Новая координата" +

        "<br>" +

        parsed.lon.toFixed(6) +

        ", " +

        parsed.lat.toFixed(6)

    )

    .openPopup();


    document
        .getElementById(
            "coordinateInput"
        )
        .value =

            parsed.lon.toFixed(6) +

            ", " +

            parsed.lat.toFixed(6);


    const existing =
        getExistingCoordinates(
            activeStop
        );


    const compareInfo =

        document.getElementById(
            "compareInfo"
        );


    compareInfo.style.display =
        "block";


    // ========================================
    // ЕСТЬ СТАРАЯ / ПРОВЕРЕННАЯ КООРДИНАТА
    // ========================================

    if (existing) {

        const distance =

            distanceMeters(

                existing.lat,
                existing.lon,

                parsed.lat,
                parsed.lon

            );


        const rounded =
            Math.round(distance);


        if (
            distance <= 20
        ) {

            compareInfo.style.background =
                "#dff6e4";


            compareInfo.style.color =
                "#146c2e";


            compareInfo.innerHTML =

                "✅ Координаты практически совпадают.<br>" +

                "Расстояние: " +

                rounded +

                " м";

        }

        else if (
            distance <= 50
        ) {

            compareInfo.style.background =
                "#fff4cc";


            compareInfo.style.color =
                "#805b00";


            compareInfo.innerHTML =

                "⚠ Есть небольшое расхождение.<br>" +

                "Старая точка ↔ новая точка: " +

                rounded +

                " м.<br>" +

                "Посмотри визуально на карте и в 2ГИС.";

        }

        else {

            compareInfo.style.background =
                "#ffe0e0";


            compareInfo.style.color =
                "#9a2424";


            compareInfo.innerHTML =

                "❗ КООРДИНАТЫ НЕ СХОДЯТСЯ.<br>" +

                "Расстояние: " +

                rounded +

                " м.<br><br>" +

                "Старая/текущая точка остаётся на карте.<br>" +

                "🟠 Оранжевая — новая координата из 2ГИС.<br><br>" +

                "Если оранжевая точка правильная — нажми ✅ Подтвердить.";

        }


        const bounds =

            L.latLngBounds([

                [
                    existing.lat,
                    existing.lon
                ],

                [
                    parsed.lat,
                    parsed.lon
                ]

            ]);


        map.fitBounds(

            bounds,

            {

                padding:
                    [80, 80],

                maxZoom:
                    18

            }

        );

    }

    // ========================================
    // КООРДИНАТЫ ВООБЩЕ НЕ БЫЛО
    // ========================================

    else {

        compareInfo.style.background =
            "#fff4cc";


        compareInfo.style.color =
            "#805b00";


        compareInfo.innerHTML =

            "🟠 Это новая координата.<br>" +

            "Старой координаты для сравнения нет.<br>" +

            "Проверь точку по 2ГИС и только потом подтверждай.";


        map.setView(

            [
                parsed.lat,
                parsed.lon
            ],

            18

        );
    }


    showMessage(

        "🟠 Проверь точку. Если это действительно отстой — нажми ✅ Подтвердить.",

        "ok"

    );
}



// ============================================================
// ИМЯ ПРОВЕРЯЮЩЕГО
// ============================================================

function getReviewer() {

    const input =

        document.getElementById(
            "reviewerInput"
        );


    const name =
        input.value.trim();


    if (name) {

        localStorage.setItem(

            "sma_reviewer",

            name

        );
    }


    return name;
}



// ============================================================
// ПОДТВЕРДИТЬ
// ============================================================

async function confirmCurrent() {

    if (!activeStop) {

        showMessage(

            "Сначала выберите отстой.",

            "error"

        );

        return;
    }


    if (!candidate) {

        showMessage(

            "Сначала вставь координаты или URL 2ГИС и нажми 📍 Показать.",

            "error"

        );

        return;
    }


    const reviewer =
        getReviewer();


    if (!reviewer) {

        showMessage(

            "Укажи имя проверяющего.",

            "error"

        );

        return;
    }


    try {

        await sendRecord({

            id:
                activeStop.id,

            name:
                activeStop.name,

            routes:

                (
                    activeStop.routes ||
                    []
                ).join(", "),

            park:

                (
                    activeStop.parks ||
                    []
                ).join(", "),

            url:
                activeStop.url || "",

            lat:
                candidate.lat,

            lon:
                candidate.lon,

            status:
                "ПРОВЕРЕНО",

            reviewer:
                reviewer,

            note:

                document
                    .getElementById(
                        "noteInput"
                    )
                    .value
                    .trim()

        });


        candidateLayer
            .clearLayers();


        candidate =
            null;


        clearCompare();


        renderEverything();


        selectStop(
            activeStop.id
        );


        showMessage(

            "✅ Координата сохранена и отстой подтверждён.",

            "ok"

        );

    }

    catch (error) {

        showMessage(

            "Ошибка: " +
            error.message,

            "error"

        );
    }
}



// ============================================================
// ПРОБЛЕМА
// ============================================================

async function markProblem() {

    if (!activeStop) {

        return;
    }


    const reviewer =
        getReviewer();


    if (!reviewer) {

        showMessage(

            "Укажи имя проверяющего.",

            "error"

        );

        return;
    }


    const parsed =

        parseCoordinates(

            document
                .getElementById(
                    "coordinateInput"
                )
                .value

        );


    try {

        await sendRecord({

            id:
                activeStop.id,

            name:
                activeStop.name,

            routes:

                (
                    activeStop.routes ||
                    []
                ).join(", "),

            park:

                (
                    activeStop.parks ||
                    []
                ).join(", "),

            url:
                activeStop.url || "",

            lat:
                parsed
                    ? parsed.lat
                    : "",

            lon:
                parsed
                    ? parsed.lon
                    : "",

            status:
                "ПРОБЛЕМА",

            reviewer:
                reviewer,

            note:

                document
                    .getElementById(
                        "noteInput"
                    )
                    .value
                    .trim()

        });


        candidateLayer
            .clearLayers();


        candidate =
            null;


        clearCompare();


        renderEverything();


        selectStop(
            activeStop.id
        );


        showMessage(

            "🔴 Отстой отмечен как проблема.",

            "ok"

        );

    }

    catch (error) {

        showMessage(

            "Ошибка: " +
            error.message,

            "error"

        );
    }
}



// ============================================================
// МАРКЕРЫ
// ============================================================

function renderMapMarkers() {

    sourceLayer
        .clearLayers();


    verifiedLayer
        .clearLayers();


    problemLayer
        .clearLayers();


    allStops.forEach(

        function(stop) {

            const status =
                getStatus(stop);


            const record =
                getRecord(stop);


            let lat =
                null;


            let lon =
                null;


            let layer =
                null;


            let color =
                null;


            let statusText =
                "";


            if (
                status === "ПРОВЕРЕНО"
            ) {

                if (
                    !record ||
                    !validCoordinates(

                        Number(record.lat),

                        Number(record.lon)

                    )
                ) {

                    return;
                }


                lat =
                    Number(record.lat);


                lon =
                    Number(record.lon);


                layer =
                    verifiedLayer;


                color =
                    "#198754";


                statusText =
                    "🟢 Проверено";

            }

            else if (
                status === "ЕСТЬ КООРДИНАТА"
            ) {

                lat =
                    Number(stop.lat);


                lon =
                    Number(stop.lon);


                layer =
                    sourceLayer;


                color =
                    "#126caa";


                statusText =
                    "🔵 Есть старая координата";

            }

            else if (
                status === "ПРОБЛЕМА"
            ) {

                if (
                    record &&
                    validCoordinates(

                        Number(record.lat),

                        Number(record.lon)

                    )
                ) {

                    lat =
                        Number(record.lat);


                    lon =
                        Number(record.lon);

                }

                else if (
                    hasSourceCoordinates(stop)
                ) {

                    lat =
                        Number(stop.lat);


                    lon =
                        Number(stop.lon);

                }

                else {

                    return;
                }


                layer =
                    problemLayer;


                color =
                    "#dc3545";


                statusText =
                    "🔴 Проблема";
            }


            if (
                !layer ||
                !validCoordinates(
                    lat,
                    lon
                )
            ) {

                return;
            }


            const marker =

                L.circleMarker(

                    [
                        lat,
                        lon
                    ],

                    {

                        radius: 8,

                        color:
                            "#ffffff",

                        weight: 2,

                        fillColor:
                            color,

                        fillOpacity: 1

                    }

                )

                .addTo(
                    layer
                );


            marker.bindTooltip(

                String(

                    (
                        stop.routes ||
                        []
                    ).length

                ),

                {

                    permanent:
                        true,

                    direction:
                        "right",

                    offset:
                        [9, 0],

                    className:
                        "route-count-label"

                }

            );


            marker.bindPopup(

                "<b>" +

                stop.name +

                "</b>" +

                "<br><br>" +

                statusText +

                "<br><br>" +

                "Маршруты: " +

                (
                    stop.routes ||
                    []
                ).join(", ")

            );


            marker.on(

                "click",

                function() {

                    selectStop(
                        stop.id
                    );

                }

            );

        }

    );
}



// ============================================================
// СЛЕДУЮЩИЙ НА ПРОВЕРКУ
// ============================================================

function nextReview() {

    const sourceStop =

        allStops.find(

            stop =>

                getStatus(stop) ===
                "ЕСТЬ КООРДИНАТА"

        );


    if (sourceStop) {

        selectStop(
            sourceStop.id
        );

        return;
    }


    const pendingStop =

        allStops.find(

            stop =>

                getStatus(stop) ===
                "НЕ ПРОВЕРЕНО"

        );


    if (pendingStop) {

        selectStop(
            pendingStop.id
        );

        return;
    }


    const problemStop =

        allStops.find(

            stop =>

                getStatus(stop) ===
                "ПРОБЛЕМА"

        );


    if (problemStop) {

        selectStop(
            problemStop.id
        );

        return;
    }


    showMessage(

        "Все отстои обработаны 🎉",

        "ok"

    );
}



// ============================================================
// ВСЯ ОТРИСОВКА
// ============================================================

function renderEverything() {

    renderStats();

    renderStopList();

    renderMapMarkers();


    if (activeStop) {

        renderCurrentStop();
    }
}



// ============================================================
// СООБЩЕНИЯ
// ============================================================

function showMessage(
    text,
    type
) {

    const el =

        document.getElementById(
            "message"
        );


    el.textContent =
        text;


    el.className =

        "message " +
        type;
}



function clearMessage() {

    const el =

        document.getElementById(
            "message"
        );


    el.textContent =
        "";


    el.className =
        "message";
}

// СОБЫТИЯ

document

    )

document

    )

    )

document

document

// ============================================================
// СОХРАНЕНИЕ ИМЕНИ ПРОВЕРЯЮЩЕГО
// ============================================================

document
    .getElementById(
        "reviewerInput"
    )
    .value =

        localStorage.getItem(
            "sma_reviewer"
        ) || "";



// ============================================================
// СТАРТ

renderStats();

renderStopList();

renderMapMarkers();

loadRecords();



// ============================================================
// АВТОСИНХРОНИЗАЦИЯ РАЗ В МИНУТУ
// ============================================================

setInterval(

    60000

);


</script>
