<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMA MAP ROAD</title>
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f5f7;
    color: #1f2937;
}
header {
    background: #142f44;
    color: white;
    padding: 13px 18px;
}
header h1 {
    margin: 0;
    font-size: 23px;
}
header p {
    margin: 4px 0 0;
    color: #cdd9e3;
}
/* ============================================================
   TOP
============================================================ */
#modeBar,
#topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 9px 14px;
}
.mode-button {
    padding: 10px 18px;
    border: 2px solid #d5dbe2;
    background: #f4f6f8;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}
.mode-button.active-stop {
    background: #198754;
    border-color: #198754;
    color: white;
}
.mode-button.active-turn {
    background: #7c3aed;
    border-color: #7c3aed;
    color: white;
}
.stat {
    padding: 7px 11px;
    background: #eef2f6;
    border-radius: 8px;
    font-weight: bold;
}
.stat span {
    color: #126caa;
}
#syncStatus {
    margin-left: auto;
    font-size: 13px;
    font-weight: bold;
}
/* ============================================================
   LAYOUT
============================================================ */
.layout {
    display: grid;
    grid-template-columns:
        330px 1fr;
    height:
        calc(100vh - 190px);
}
/* ============================================================
   SIDEBAR
============================================================ */
.sidebar {
    display: flex;
    flex-direction: column;
    background: white;
    border-right: 1px solid #ddd;
    overflow: hidden;
}
.sidebar-controls {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}
input,
select {
    width: 100%;
    padding: 9px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 14px;
    font-family: Arial, sans-serif;
}
.gap {
    margin-top: 8px;
}
#itemList {
    flex: 1;
    overflow-y: auto;
}
/* ============================================================
   LIST
============================================================ */
.list-item {
    display: block;
    width: 100%;
    padding: 11px;
    border: none;
    border-bottom: 1px solid #eee;
    background: white;
    text-align: left;
    cursor: pointer;
}
.list-item:hover {
    background: #f5f7fa;
}
.list-item.active {
    background: #e9f3fb;
    border-left: 5px solid #126caa;
}
.list-title {
    font-weight: bold;
    margin-bottom: 4px;
}
.list-subtitle {
    font-size: 12px;
    color: #64748b;
    line-height: 1.4;
}
/* ============================================================
   STATUS
============================================================ */
.status {
    display: inline-block;
    margin-top: 6px;
    padding: 4px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: bold;
}
.status-verified {
    background: #d9f5df;
    color: #146c2e;
}
.status-source {
    background: #dceeff;
    color: #075985;
}
.status-turn-source {
    background: #ede9fe;
    color: #6d28d9;
}
.status-pending {
    background: #eee9f6;
    color: #5b5170;
}
.status-problem {
    background: #ffe1e1;
    color: #9a2424;
}
/* ============================================================
   MAIN
============================================================ */
.main {
    display: grid;
    grid-template-rows:
        minmax(390px, 1fr)
        auto;
    overflow: hidden;
}
#map {
    width: 100%;
    height: 100%;
}
/* ============================================================
   PANEL
============================================================ */
.verification-panel {
    background: white;
    border-top: 1px solid #ddd;
    padding: 14px 16px;
    max-height: 48vh;
    overflow-y: auto;
}
.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}
.panel-header h2 {
    margin: 0 0 5px;
}
#currentStatus {
    font-weight: bold;
}
.info-grid {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);
    gap: 9px;
    margin-top: 11px;
}
.info-box {
    padding: 9px;
    background: #f4f6f8;
    border-radius: 7px;
}
.info-title {
    margin-bottom: 4px;
    font-size: 11px;
    color: #64748b;
}
.coordinate-row {
    display: grid;
    grid-template-columns:
        1fr 145px;
    gap: 9px;
    margin-top: 11px;
}
.reviewer-row {
    display: grid;
    grid-template-columns:
        1fr 1fr;
    gap: 9px;
    margin-top: 9px;
}
#compareInfo {
    display: none;
    margin-top: 9px;
    padding: 10px 12px;
    border-radius: 7px;
    font-weight: bold;
    line-height: 1.5;
}
/* ============================================================
   BUTTONS
============================================================ */
.actions {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
    margin-top: 10px;
}
button {
    border: none;
    border-radius: 6px;
    padding: 9px 13px;
    cursor: pointer;
    font-weight: bold;
}
button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
.btn-blue {
    background: #126caa;
    color: white;
}
.btn-green {
    background: #198754;
    color: white;
}
.btn-red {
    background: #dc3545;
    color: white;
}
.btn-dark {
    background: #1f2937;
    color: white;
}
.btn-gray {
    background: #e5e7eb;
}
.source-link {
    display: inline-block;
    padding: 10px 13px;
    background: #126caa;
    color: white;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    white-space: nowrap;
}
/* ============================================================
   MESSAGE
============================================================ */
.message {
    display: none;
    margin-top: 9px;
    padding: 10px;
    border-radius: 6px;
}
.message.ok {
    display: block;
    background: #dff6e4;
    color: #146c2e;
}
.message.error {
    display: block;
    background: #ffe0e0;
    color: #9a2424;
}
/* ============================================================
   MAP LABELS
============================================================ */
.route-count-label {
    background: white;
    border: 2px solid #333;
    border-radius: 18px;
    padding: 2px 7px;
    font-weight: bold;
}
.turn-label {
    background: #7c3aed;
    color: white;
    border: 2px solid white;
    border-radius: 14px;
    padding: 2px 6px;
    font-weight: bold;
}
.turn-pending-label {
    background: #64748b;
    color: white;
    border: 2px solid white;
    border-radius: 14px;
    padding: 2px 6px;
    font-weight: bold;
}

.zone-label {
    min-width: 88px;
    padding: 5px 8px;
    border-radius: 8px;
    color: white;
    border: 2px solid white;
    font-size: 12px;
    font-weight: bold;
    text-align: center;
    line-height: 1.25;
    box-shadow: 0 2px 7px rgba(0,0,0,0.25);
    white-space: nowrap;
}

.zone-summary-control {
    background: rgba(255,255,255,0.96);
    padding: 9px 11px;
    border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.28);
    font-size: 12px;
    line-height: 1.45;
    min-width: 210px;
}

.zone-summary-title {
    font-weight: bold;
    margin-bottom: 5px;
}

.zone-summary-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
}
/* ============================================================
   MOBILE
============================================================ */
@media(max-width: 900px) {
    .layout {
        grid-template-columns: 1fr;
        height: auto;
    }
    .sidebar {
        height: 360px;
    }
    .main {
        height: 900px;
    }
    .info-grid,
    .coordinate-row,
    .reviewer-row {
        grid-template-columns: 1fr;
    }
    #syncStatus {
        width: 100%;
        margin-left: 0;
    }
}


/* ============================================================
   COMPACT / RESPONSIVE UI — PHONE + DESKTOP
   ============================================================ */

/* Общий компактный интерфейс */
header {
    padding: 8px 12px;
}

header h1 {
    font-size: 19px;
    line-height: 1.15;
}

header p {
    margin-top: 2px;
    font-size: 12px;
    line-height: 1.25;
}

#modeBar {
    padding: 6px 10px;
    gap: 6px;
    flex-wrap: nowrap;
}

#topbar {
    padding: 6px 10px;
    gap: 5px;
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
}

#topbar::-webkit-scrollbar {
    display: none;
}

.mode-button {
    padding: 7px 12px;
    border-width: 1px;
    border-radius: 7px;
    font-size: 12px;
    min-height: 34px;
}

.stat {
    flex: 0 0 auto;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 12px;
    white-space: nowrap;
}

#syncStatus {
    flex: 0 0 auto;
    margin-left: auto;
    font-size: 11px;
    white-space: nowrap;
}

#refreshButton {
    flex: 0 0 auto;
    padding: 6px 9px;
    font-size: 11px;
}

.layout {
    grid-template-columns: 290px minmax(0, 1fr);
    height: calc(100vh - 137px);
    height: calc(100dvh - 137px);
}

.sidebar-controls {
    padding: 7px;
}

input,
select {
    padding: 7px 8px;
    font-size: 12px;
    min-height: 34px;
}

.gap {
    margin-top: 6px;
}

.list-item {
    padding: 8px 9px;
}

.list-title {
    margin-bottom: 2px;
    font-size: 13px;
}

.list-subtitle {
    font-size: 11px;
    line-height: 1.3;
}

.status {
    margin-top: 4px;
    padding: 3px 6px;
    font-size: 10px;
}

.verification-panel {
    padding: 9px 11px;
    max-height: 40vh;
}

.panel-header {
    gap: 8px;
}

.panel-header h2 {
    margin-bottom: 3px;
    font-size: 16px;
}

#currentStatus {
    font-size: 11px;
}

.info-grid {
    gap: 6px;
    margin-top: 7px;
}

.info-box {
    padding: 6px 7px;
}

.info-title {
    margin-bottom: 2px;
    font-size: 10px;
}

.coordinate-row,
.reviewer-row {
    gap: 6px;
    margin-top: 7px;
}

.actions {
    gap: 6px;
    margin-top: 7px;
}

button {
    padding: 7px 10px;
    font-size: 12px;
}

.source-link {
    padding: 7px 10px;
    font-size: 11px;
}

.message,
#compareInfo {
    margin-top: 6px;
    padding: 7px 9px;
    font-size: 11px;
}

/* Компактные контролы Leaflet */
.leaflet-control-layers {
    max-width: 255px;
    max-height: 62vh;
    overflow-y: auto;
    font-size: 11px;
}

.leaflet-control-layers-expanded {
    padding: 6px 8px;
}

.leaflet-control-layers-toggle {
    width: 32px;
    height: 32px;
    background-size: 20px 20px;
}

.leaflet-bar a,
.leaflet-bar a:hover {
    width: 30px;
    height: 30px;
    line-height: 30px;
    font-size: 18px;
}

.route-count-label {
    border-width: 1px;
    padding: 1px 5px;
    font-size: 10px;
}

.turn-label,
.turn-pending-label {
    border-width: 1px;
    padding: 1px 4px;
    font-size: 10px;
}

.zone-label {
    min-width: 70px;
    padding: 4px 6px;
    border-width: 1px;
    font-size: 10px;
}

.zone-summary-control {
    min-width: 175px;
    padding: 6px 8px;
    border-radius: 7px;
    font-size: 10px;
    line-height: 1.3;
}

.zone-summary-title {
    margin-bottom: 3px;
}

.zone-summary-row {
    gap: 7px;
}

/* ============================================================
   PHONE / TABLET
   ============================================================ */
@media (max-width: 900px) {
    body {
        font-size: 12px;
    }

    header {
        padding: 7px 10px;
    }

    header h1 {
        font-size: 18px;
    }

    header p {
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    #modeBar {
        padding: 5px 8px;
        gap: 5px;
    }

    .mode-button {
        flex: 1 1 0;
        padding: 6px 7px;
        min-height: 34px;
        font-size: 11px;
    }

    #topbar {
        padding: 5px 8px;
        gap: 5px;
        -webkit-overflow-scrolling: touch;
    }

    .stat {
        padding: 4px 7px;
        font-size: 10.5px;
    }

    #refreshButton {
        padding: 5px 7px;
        font-size: 10px;
    }

    #syncStatus {
        width: auto;
        margin-left: 0;
        font-size: 10px;
    }

    .layout {
        display: flex;
        flex-direction: column;
        height: auto;
    }

    /* Список оставляем сверху, но делаем значительно ниже,
       чтобы карта начиналась почти сразу. */
    .sidebar {
        order: 1;
        height: 220px;
        min-height: 220px;
        border-right: 0;
        border-bottom: 1px solid #d9dee5;
    }

    .sidebar-controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 118px;
        gap: 5px;
        padding: 6px;
    }

    #searchInput {
        grid-column: 1 / -1;
    }

    #statusFilter,
    #nextButton {
        margin-top: 0 !important;
        min-width: 0;
    }

    #nextButton {
        width: 100% !important;
        padding: 6px 5px;
        font-size: 10px;
        line-height: 1.15;
    }

    .list-item {
        padding: 6px 8px;
    }

    .list-title {
        font-size: 12px;
    }

    .list-subtitle {
        font-size: 10px;
        line-height: 1.2;
    }

    .status {
        margin-top: 3px;
        padding: 2px 5px;
        font-size: 9px;
    }

    .main {
        order: 2;
        height: auto;
        min-height: 0;
        grid-template-rows: 58vh auto;
        grid-template-rows: 58dvh auto;
        overflow: visible;
    }

    #map {
        height: 58vh;
        height: 58dvh;
        min-height: 360px;
    }

    .verification-panel {
        max-height: none;
        padding: 8px;
    }

    .panel-header {
        align-items: flex-start;
        gap: 6px;
    }

    .panel-header h2 {
        font-size: 14px;
    }

    .source-link {
        padding: 6px 7px;
        font-size: 10px;
    }

    .info-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 5px;
        margin-top: 6px;
    }

    .info-box {
        min-width: 0;
        padding: 5px 6px;
        font-size: 11px;
        overflow-wrap: anywhere;
    }

    .coordinate-row {
        grid-template-columns: minmax(0, 1fr) 92px;
        gap: 5px;
        margin-top: 6px;
    }

    .reviewer-row {
        grid-template-columns: 1fr;
        gap: 5px;
        margin-top: 5px;
    }

    input,
    select {
        padding: 6px 7px;
        min-height: 32px;
        font-size: 11px;
    }

    button {
        padding: 6px 8px;
        font-size: 11px;
    }

    .actions button {
        flex: 1 1 120px;
    }

    /* Слой справа по умолчанию свёрнут; после открытия — компактный. */
    .leaflet-control-layers {
        max-width: 225px;
        max-height: 48vh;
        font-size: 9.5px;
    }

    .leaflet-control-layers-expanded {
        padding: 5px 6px;
    }

    .leaflet-control-layers label {
        margin: 1px 0;
    }

    .leaflet-control-layers-selector {
        transform: scale(0.82);
        margin-right: 1px;
    }

    .leaflet-control-layers-toggle {
        width: 30px;
        height: 30px;
        background-size: 19px 19px;
    }

    .leaflet-bar a,
    .leaflet-bar a:hover {
        width: 28px;
        height: 28px;
        line-height: 28px;
        font-size: 17px;
    }

    .zone-summary-control {
        min-width: 0;
        max-width: 145px;
        padding: 5px 6px;
        font-size: 8.5px;
        line-height: 1.25;
    }

    .zone-summary-row {
        gap: 4px;
    }

    .zone-label {
        min-width: 56px;
        padding: 2px 4px;
        font-size: 8.5px;
    }

    .route-count-label,
    .turn-label,
    .turn-pending-label {
        font-size: 8.5px;
    }
}

/* На совсем узких телефонах оставляем у сводки только заголовок,
   чтобы она не закрывала карту. */
@media (max-width: 480px) {
    .zone-summary-control {
        max-width: 115px;
    }

    .zone-summary-row,
    .zone-summary-control > div:last-child {
        display: none;
    }

    .zone-summary-title {
        margin-bottom: 0;
        white-space: nowrap;
    }

    .sidebar {
        height: 205px;
        min-height: 205px;
    }

    .main {
        grid-template-rows: 60vh auto;
        grid-template-rows: 60dvh auto;
    }

    #map {
        height: 60vh;
        height: 60dvh;
    }
}

</style>
</head>
<body>
<header>
    <h1>
        SMA MAP ROAD
    </h1>
    <p>
        Отстои и развороты общественного транспорта Алматы
    </p>
</header>
<div id="modeBar">
    <button
        id="stopsModeButton"
        class="mode-button"
    >
        🟢 ОТСТОИ
    </button>
    <button
        id="turnsModeButton"
        class="mode-button"
    >
        🔄 РАЗВОРОТЫ
    </button>
</div>
<div id="topbar">
    <div class="stat">
        Режим:
        <span id="modeStat">
            —
        </span>
    </div>
    <div class="stat">
        Всего:
        <span id="totalCount">
            0
        </span>
    </div>
    <div class="stat">
        ✅ Проверено:
        <span id="verifiedCount">
            0
        </span>
    </div>
    <div class="stat">
        📍 Есть координата:
        <span id="sourceCount">
            0
        </span>
    </div>
    <div class="stat">
        ⚪ Без координат:
        <span id="pendingCount">
            0
        </span>
    </div>
    <div class="stat">
        🔴 Проблема:
        <span id="problemCount">
            0
        </span>
    </div>
    <button
        id="refreshButton"
        class="btn-gray"
    >
        ↻ Обновить
    </button>
    <div id="syncStatus">
        Подключение...
    </div>
</div>
<div class="layout">
<aside class="sidebar">
    <div class="sidebar-controls">
        <input
            id="searchInput"
            placeholder="Поиск"
        >
        <select
            id="statusFilter"
            class="gap"
        >
            <option value="ALL">
                Все
            </option>
            <option value="ПРОВЕРЕНО">
                ✅ Проверено
            </option>
            <option
                id="sourceOption"
                value="ЕСТЬ КООРДИНАТА"
            >
                📍 Есть координата
            </option>
            <option value="НЕ ПРОВЕРЕНО">
                ⚪ Без координат
            </option>
            <option value="ПРОБЛЕМА">
                🔴 Проблема
            </option>
        </select>
        <button
            id="nextButton"
            class="btn-dark gap"
            style="width:100%"
        >
            Следующий на проверку →
        </button>
    </div>
    <div id="itemList">
    </div>
</aside>
<main class="main">
    <div id="map">
    </div>
    <section class="verification-panel">
        <div class="panel-header">
            <div>
                <h2 id="currentName">
                    Выберите объект
                </h2>
                <div id="currentStatus">
                    —
                </div>
            </div>
            <a
                id="sourceLink"
                class="source-link"
                href="#"
                target="_blank"
                rel="noopener"
            >
                🌐 Открыть 2ГИС
            </a>
        </div>
        <div class="info-grid">
            <div class="info-box">
                <div
                    id="infoTitle1"
                    class="info-title"
                >
                    Маршрут
                </div>
                <div id="infoValue1">
                    —
                </div>
            </div>
            <div class="info-box">
                <div
                    id="infoTitle2"
                    class="info-title"
                >
                    Автопарк
                </div>
                <div id="infoValue2">
                    —
                </div>
            </div>
            <div class="info-box">
                <div
                    id="infoTitle3"
                    class="info-title"
                >
                    Вторая конечная
                </div>
                <div id="infoValue3">
                    —
                </div>
            </div>
            <div class="info-box">
                <div class="info-title">
                    Последняя проверка
                </div>
                <div id="lastCheck">
                    —
                </div>
            </div>
        </div>
        <div class="coordinate-row">
            <input
                id="coordinateInput"
                placeholder="Вставь координаты или полный URL 2ГИС"
            >
            <button
                id="showButton"
                class="btn-blue"
            >
                📍 Показать
            </button>
        </div>
        <div id="compareInfo">
        </div>
        <div class="reviewer-row">

// ============================================================
// ВСЕ СЛОИ МОГУТ РАБОТАТЬ ОДНОВРЕМЕННО
// ============================================================
// При старте показываем и отстои, и развороты.
// После этого галочки справа полностью управляют видимостью.
// Переключатель ОТСТОИ / РАЗВОРОТЫ меняет только список,
// статистику и форму проверки — карту он больше не очищает.
[

// ============================================================
// DATA
// ============================================================
let stopRecords =
    new Map();
let turnRecords =
    new Map();
let activeStop =
    null;
let activeTurn =
    null;
let candidate =
    null;
let saving =
    false;
// ============================================================
// STOP ID
// ============================================================
function makeStopId(
    stop,
    index
) {
    if (stop.url) {
        const match =
            stop.url.match(
                /go\.2gis\.com\/([^/?#]+)/i
            );
        if (match) {
            return (
                "2GIS-" +
                match[1]
            );
        }
    }
    const text =
        [
            stop.url || "",
            stop.name || "",
            (
                stop.routes ||
                []
            ).join(","),
            index
        ].join("|");
    let hash =
        2166136261;
    for (
        let i = 0;
        i < text.length;
        i++
    ) {
        hash ^=
            text.charCodeAt(i);
        hash =
            Math.imul(
                hash,
                16777619
            );
    }
    return (
        "STOP-" +
        (
            hash >>> 0
        ).toString(16)
    );
}
const allStops =
    stops.map(
        function(
            stop,
            index
        ) {
            return {
                ...stop,
                id:
                    makeStopId(
                        stop,
                        index
                    )
            };
        }
    );
const allTurns =
    typeof turnarounds !==
    "undefined"
        ? turnarounds
        : [];
// ============================================================
// COORDINATES
// ============================================================
function validCoordinates(
    lat,
    lon
) {
    return (
        Number.isFinite(lat) &&
        Number.isFinite(lon) &&
        lat >= 42 &&
        lat <= 45 &&
        lon >= 75 &&
        lon <= 80
    );
}
// ============================================================
// RECORDS
// ============================================================
function getStopRecord(stop) {
    return (
        stopRecords.get(
            String(stop.id)
        ) || null
    );
}
function getTurnRecord(turn) {
    return (
        turnRecords.get(
            String(turn.id)
        ) || null
    );
}
// ============================================================
// STOP COORDINATES
// ============================================================
function getStopCoordinates(stop) {
    const record =
        getStopRecord(stop);
    if (
        record &&
        validCoordinates(
            Number(record.lat),
            Number(record.lon)
        )
    ) {
        return {
            lat:
                Number(record.lat),
            lon:
                Number(record.lon),
            source:
                "record"
        };
    }
    if (
        validCoordinates(
            Number(stop.lat),
            Number(stop.lon)
        )
    ) {
        return {
            lat:
                Number(stop.lat),
            lon:
                Number(stop.lon),
            source:
                "stops"
        };
    }
    return null;
}
// ============================================================
// HELPERS
// ============================================================
function routeHasStop(
    stop,
    route
) {
    return (
        (
            stop.routes ||
            []
        )
        .map(
            String
        )
        .includes(
            String(route)
        )
    );
}
function normalizeName(value) {
    return String(
        value || ""
    )
    .trim()
    .toLowerCase();
}
// ============================================================
// TERMINAL STOP
// ============================================================
function findTerminalStop(turn) {
    const terminal =
        normalizeName(
            turn.terminal
        );
    const route =
        String(
            turn.route || ""
        )
        .trim();
    if (
        !terminal ||
        terminal ===
        "нужно найти"
    ) {
        return null;
    }
    return (
        allStops.find(
            function(stop) {
                return (
                    normalizeName(
                        stop.name
                    ) ===
                    terminal &&
                    routeHasStop(
                        stop,
                        route
                    )
                );
            }
        )
        ||
        allStops.find(
            function(stop) {
                return (
                    normalizeName(
                        stop.name
                    ) ===
                    terminal
                );
            }
        )
        ||
        null
    );
}
// ============================================================
// REAL TURN COORDINATES
// ============================================================
function getTurnCoordinates(turn) {
    const record =
        getTurnRecord(turn);
    if (
        record &&
        validCoordinates(
            Number(record.lat),
            Number(record.lon)
        )
    ) {
        return {
            lat:
                Number(record.lat),
            lon:
                Number(record.lon),
            source:
                "record"
        };
    }
    if (
        validCoordinates(
            Number(turn.lat),
            Number(turn.lon)
        )
    ) {
        return {
            lat:
                Number(turn.lat),
            lon:
                Number(turn.lon),
            source:
                "turnarounds"
        };
    }
    const terminalStop =
        findTerminalStop(turn);
    if (terminalStop) {
        const coordinates =
            getStopCoordinates(
                terminalStop
            );
        if (coordinates) {
            return {
                lat:
                    coordinates.lat,
                lon:
                    coordinates.lon,
                source:
                    "verified-stop"
            };
        }
    }
    return null;
}
// ============================================================
// FROM STOP FOR TEMPORARY POINT
// ============================================================
function findFromStop(turn) {
    const from =
        normalizeName(
            turn.from
        );
    const route =
        String(
            turn.route || ""
        )
        .trim();
    let stop =
        allStops.find(
            function(item) {
                return (
                    normalizeName(
                        item.name
                    ) ===
                    from &&
                    routeHasStop(
                        item,
                        route
                    )
                );
            }
        );
    if (!stop) {
        stop =
            allStops.find(
                function(item) {
                    return (
                        routeHasStop(
                            item,
                            route
                        ) &&
                        getStopCoordinates(
                            item
                        )
                    );
                }
            );
    }
    return stop || null;
}
// ============================================================
// HASH FOR SMALL OFFSET
// ============================================================
function routeHash(text) {
    let hash =
        0;
    for (
        const char of
        String(text || "")
    ) {
        hash =
            (
                (
                    hash << 5
                )
                -
                hash
                +
                char.charCodeAt(0)
            )
            |
            0;
    }
    return Math.abs(
        hash
    );
}
// ============================================================
// DISPLAY COORDINATES
//
// Если настоящий разворот ещё не найден,
// показываем СЕРУЮ временную точку рядом
// с известным отстоем маршрута.
//
// Она НЕ становится настоящей координатой.
// ============================================================
function getTurnDisplayCoordinates(turn) {
    const real =
        getTurnCoordinates(turn);
    if (real) {
        return {
            lat:
                real.lat,
            lon:
                real.lon,
            temporary:
                false
        };
    }
    const stop =
        findFromStop(turn);
    if (!stop) {
        return null;
    }
    const coordinates =
        getStopCoordinates(stop);
    if (!coordinates) {
        return null;
    }
    const hash =
        routeHash(
            turn.route
        );
    const angle =
        (
            hash % 360
        )
        *
        Math.PI
        /
        180;
    // небольшой разброс,
    // чтобы 10 маршрутов не стояли
    // точно друг на друге
    const radius =
        0.00045
        +
        (
            hash % 7
        )
        *
        0.00009;
    return {
        lat:
            coordinates.lat
            +
            Math.sin(
                angle
            )
            *
            radius,
        lon:
            coordinates.lon
            +
            Math.cos(
                angle
            )
            *
            radius,
        temporary:
            true,
        baseStop:
            stop.name
    };
}
// ============================================================
// 4 ЗОНЫ ДЛЯ ИНЖЕНЕРОВ
//
// Сейчас учитываем ВСЕ объекты:
// - все отстои;
// - все развороты;
// - непроверенные развороты тоже входят в нагрузку;
// - если у разворота пока нет реальной координаты,
//   используется его СЕРАЯ временная точка только для
//   предварительного распределения нагрузки.
//
// После проверки разворотов зоны пересчитаются автоматически.
// Позже, когда координаты будут финальными, границы можно
// зафиксировать и уже распределить 12 инженеров по зонам.
// ============================================================

const ZONE_DEFINITIONS = [
    {
        id: 1,
        name: "Зона 1",
        direction: "Северо-запад",
        shortDirection: "СЗ",
        color: "#dc3545",
        layer: zone1Layer
    },
    {
        id: 2,
        name: "Зона 2",
        direction: "Северо-восток",
        shortDirection: "СВ",
        color: "#126caa",
        layer: zone2Layer
    },
    {
        id: 3,
        name: "Зона 3",
        direction: "Юго-запад",
        shortDirection: "ЮЗ",
        color: "#198754",
        layer: zone3Layer
    },
    {
        id: 4,
        name: "Зона 4",
        direction: "Юго-восток",
        shortDirection: "ЮВ",
        color: "#d59b00",
        layer: zone4Layer
    }
];

let zoneAssignments = new Map();
let zoneSummary = [];

function collectObjectsForZones() {
    const objects = [];

    allStops.forEach(function(stop) {
        const coordinates = getStopCoordinates(stop);

        if (!coordinates) {
            return;
        }

        objects.push({
            id: "stop:" + String(stop.id),
            type: "stop",
            lat: Number(coordinates.lat),
            lon: Number(coordinates.lon),
            temporary: false,
            name: stop.name || "",
            routes: (stop.routes || []).map(String)
        });
    });

    allTurns.forEach(function(turn) {
        const coordinates = getTurnDisplayCoordinates(turn);

        if (!coordinates) {
            return;
        }

        objects.push({
            id: "turn:" + String(turn.id),
            type: "turn",
            lat: Number(coordinates.lat),
            lon: Number(coordinates.lon),
            temporary: !!coordinates.temporary,
            route: String(turn.route || ""),
            status: getTurnStatus(turn)
        });
    });

    return objects.filter(function(item) {
        return validCoordinates(item.lat, item.lon);
    });
}

function midpointBetween(a, b) {
    if (!Number.isFinite(a) || !Number.isFinite(b)) {
        return null;
    }

    return (a + b) / 2;
}

function splitBalanced(items, field) {
    const sorted = [...items].sort(function(a, b) {
        return a[field] - b[field];
    });

    const splitIndex = Math.floor(sorted.length / 2);

    return {
        low: sorted.slice(0, splitIndex),
        high: sorted.slice(splitIndex)
    };
}

function calculateBalancedZones() {
    const objects = collectObjectsForZones();

    if (objects.length < 4) {
        return null;
    }

    // 1) Делим весь объём примерно пополам запад / восток.
    const westEast = splitBalanced(objects, "lon");
    const west = westEast.low;
    const east = westEast.high;

    if (!west.length || !east.length) {
        return null;
    }

    // 2) Каждую половину делим примерно пополам юг / север.
    // В итоге получаем 4 географически цельные зоны
    // с максимально близким количеством объектов.
    const westSouthNorth = splitBalanced(west, "lat");
    const eastSouthNorth = splitBalanced(east, "lat");

    const groups = {
        1: westSouthNorth.high, // северо-запад
        2: eastSouthNorth.high, // северо-восток
        3: westSouthNorth.low,  // юго-запад
        4: eastSouthNorth.low   // юго-восток
    };

    const westMaxLon = Math.max(...west.map(item => item.lon));
    const eastMinLon = Math.min(...east.map(item => item.lon));
    const xSplit = midpointBetween(westMaxLon, eastMinLon);

    const westSouth = groups[3];
    const westNorth = groups[1];
    const eastSouth = groups[4];
    const eastNorth = groups[2];

    const westSouthMaxLat = Math.max(...westSouth.map(item => item.lat));
    const westNorthMinLat = Math.min(...westNorth.map(item => item.lat));
    const eastSouthMaxLat = Math.max(...eastSouth.map(item => item.lat));
    const eastNorthMinLat = Math.min(...eastNorth.map(item => item.lat));

    const yWestSplit = midpointBetween(
        westSouthMaxLat,
        westNorthMinLat
    );

    const yEastSplit = midpointBetween(
        eastSouthMaxLat,
        eastNorthMinLat
    );

    const minLat = Math.min(...objects.map(item => item.lat));
    const maxLat = Math.max(...objects.map(item => item.lat));
    const minLon = Math.min(...objects.map(item => item.lon));
    const maxLon = Math.max(...objects.map(item => item.lon));

    // Небольшой запас, чтобы полигоны не обрезали крайние точки.
    const latPadding = Math.max((maxLat - minLat) * 0.04, 0.006);
    const lonPadding = Math.max((maxLon - minLon) * 0.04, 0.008);

    const south = minLat - latPadding;
    const north = maxLat + latPadding;
    const westEdge = minLon - lonPadding;
    const eastEdge = maxLon + lonPadding;

    const polygons = {
        1: [
            [yWestSplit, westEdge],
            [north, westEdge],
            [north, xSplit],
            [yWestSplit, xSplit]
        ],
        2: [
            [yEastSplit, xSplit],
            [north, xSplit],
            [north, eastEdge],
            [yEastSplit, eastEdge]
        ],
        3: [
            [south, westEdge],
            [yWestSplit, westEdge],
            [yWestSplit, xSplit],
            [south, xSplit]
        ],
        4: [
            [south, xSplit],
            [yEastSplit, xSplit],
            [yEastSplit, eastEdge],
            [south, eastEdge]
        ]
    };

    zoneAssignments = new Map();

    Object.entries(groups).forEach(function([zoneId, items]) {
        items.forEach(function(item) {
            zoneAssignments.set(item.id, Number(zoneId));
        });
    });

    zoneSummary = ZONE_DEFINITIONS.map(function(definition) {
        const items = groups[definition.id] || [];
        const stopsCount = items.filter(item => item.type === "stop").length;
        const turnsCount = items.filter(item => item.type === "turn").length;
        const temporaryTurnsCount = items.filter(
            item => item.type === "turn" && item.temporary
        ).length;

        const center = {
            lat:
                items.reduce((sum, item) => sum + item.lat, 0) /
                Math.max(items.length, 1),
            lon:
                items.reduce((sum, item) => sum + item.lon, 0) /
                Math.max(items.length, 1)
        };

        return {
            ...definition,
            items,
            total: items.length,
            stops: stopsCount,
            turns: turnsCount,
            temporaryTurns: temporaryTurnsCount,
            center,
            polygon: polygons[definition.id]
        };
    });

    window.smaZoneAssignments = zoneAssignments;
    window.smaZoneSummary = zoneSummary;

    return zoneSummary;
}

function makeZoneLabelIcon(zone) {
    return L.divIcon({
        className: "",
        html:
            '<div class="zone-label" style="background:' +
            zone.color +
            '">' +
            zone.name.toUpperCase() +
            '<br>' +
            zone.total +
            ' объектов</div>',
        iconSize: [105, 44],
        iconAnchor: [52, 22]
    });
}

function renderZones() {
    ZONE_DEFINITIONS.forEach(function(definition) {
        definition.layer.clearLayers();
    });

    const zones = calculateBalancedZones();

    if (!zones) {
        updateZoneSummaryControl([]);
        return;
    }

    zones.forEach(function(zone) {
        const polygon = L.polygon(
            zone.polygon,
            {
                color: zone.color,
                weight: 3,
                opacity: 0.9,
                fillColor: zone.color,
                fillOpacity: 0.11,
                interactive: true
            }
        ).addTo(zone.layer);

        polygon.bindPopup(
            "<b>" +
            zone.name +
            " — " +
            zone.direction +
            "</b>" +
            "<br><br>Всего объектов: <b>" +
            zone.total +
            "</b>" +
            "<br>🟢 Отстоев: <b>" +
            zone.stops +
            "</b>" +
            "<br>🔄 Разворотов: <b>" +
            zone.turns +
            "</b>" +
            "<br>⚪ Временных разворотов: <b>" +
            zone.temporaryTurns +
            "</b>" +
            "<br><br><small>Предварительное распределение. " +
            "Непроверенные развороты сейчас учитываются по временной точке; " +
            "после их проверки зоны пересчитаются автоматически.</small>"
        );

        if (
            Number.isFinite(zone.center.lat) &&
            Number.isFinite(zone.center.lon)
        ) {
            L.marker(
                [zone.center.lat, zone.center.lon],
                {
                    icon: makeZoneLabelIcon(zone),
                    interactive: false
                }
            ).addTo(zone.layer);
        }
    });

    updateZoneSummaryControl(zones);
}

// ============================================================
// КРАТКАЯ СТАТИСТИКА 4 ЗОН НА КАРТЕ
// ============================================================
const zoneSummaryControl = L.control({
    position: "bottomright"
});

zoneSummaryControl.onAdd = function() {
    const div = L.DomUtil.create(
        "div",
        "zone-summary-control"
    );

    div.id = "zoneSummaryControl";

    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);

    return div;
};

zoneSummaryControl.addTo(map);

function updateZoneSummaryControl(zones) {
    const container = document.getElementById(
        "zoneSummaryControl"
    );

    if (!container) {
        return;
    }

    if (!zones || !zones.length) {
        container.innerHTML =
            '<div class="zone-summary-title">👷 4 зоны инженеров</div>' +
            '<div>Нет данных для расчёта.</div>';
        return;
    }

    container.innerHTML =
        '<div class="zone-summary-title">👷 4 зоны инженеров</div>' +
        zones.map(function(zone) {
            return (
                '<div class="zone-summary-row">' +
                '<span style="font-weight:bold;color:' +
                zone.color +
                '">● ' +
                zone.name +
                '</span>' +
                '<span>' +
                zone.total +
                ' (' +
                zone.stops +
                ' + ' +
                zone.turns +
                ')</span>' +
                '</div>'
            );
        }).join("") +
        '<div style="margin-top:5px;color:#64748b">' +
        'формат: всего (отстои + развороты)' +
        '</div>';
}

// ============================================================
// TURN URL
// ============================================================
function getTurnUrl(turn) {
    if (turn.url) {
        return turn.url;
    }
    const terminalStop =
        findTerminalStop(turn);
    if (
        terminalStop &&
        terminalStop.url
    ) {
        return terminalStop.url;
    }
    return (
        "https://2gis.kz/almaty/search/"
        +
        encodeURIComponent(
            "маршрут " +
            turn.route
        )
    );
}
// ============================================================
// STATUSES
// ============================================================
function getStopStatus(stop) {
    const record =
        getStopRecord(stop);
    if (
        record &&
        record.status ===
        "ПРОВЕРЕНО"
    ) {
        return "ПРОВЕРЕНО";
    }
    if (
        record &&
        record.status ===
        "ПРОБЛЕМА"
    ) {
        return "ПРОБЛЕМА";
    }
    if (
        validCoordinates(
            Number(stop.lat),
            Number(stop.lon)
        )
    ) {
        return "ЕСТЬ КООРДИНАТА";
    }
    return "НЕ ПРОВЕРЕНО";
}
function getTurnStatus(turn) {
    const record =
        getTurnRecord(turn);
    if (
        record &&
        record.status ===
        "ПРОВЕРЕНО"
    ) {
        return "ПРОВЕРЕНО";
    }
    if (
        record &&
        record.status ===
        "ПРОБЛЕМА"
    ) {
        return "ПРОБЛЕМА";
    }
    if (
        getTurnCoordinates(
            turn
        )
    ) {
        return "ЕСТЬ КООРДИНАТА";
    }
    return "НЕ ПРОВЕРЕНО";
}
// ============================================================
// LOAD
// ============================================================
async function loadRecords() {
    setSyncStatus(
        "Синхронизация..."
    );
    try {
        const stopRequest =
            fetch(
                API_URL +
                "?action=list&t=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );
        const turnRequest =
            fetch(
                API_URL +
                "?action=listTurnarounds&t=" +
                Date.now(),
                {
                    cache:
                        "no-store"
                }
            );
        const responses =
            await Promise.all([
                stopRequest,
                turnRequest
            ]);
        const stopData =
            await responses[0]
            .json();
        const turnData =
            await responses[1]
            .json();
        if (!stopData.ok) {
            throw new Error(
                stopData.error ||
                "Ошибка загрузки отстоев"
            );
        }
        if (!turnData.ok) {
            throw new Error(
                turnData.error ||
                "Ошибка загрузки разворотов"
            );
        }
        stopRecords =
            new Map(
                (
                    stopData.records ||
                    []
                )
                .map(
                    record => [
                        String(
                            record.id
                        ),
                        record
                    ]
                )
            );
        turnRecords =
            new Map(
                (
                    turnData.records ||
                    []
                )
                .map(
                    record => [
                        String(
                            record.id
                        ),
                        record
                    ]
                )
            );
        renderEverything();
        setSyncStatus(
            "● Синхронизировано"
        );
    }
    catch(error) {
        console.error(
            error
        );
        setSyncStatus(
            "⚠ Ошибка связи"
        );
        showMessage(
            error.message,
            "error"
        );
    }
}
// ============================================================
// SAVE
// ============================================================
async function sendRecord(
    type,
    record
) {
    if (saving) {
        return;
    }
    saving =
        true;
    setButtonsDisabled(
        true
    );
    setSyncStatus(
        "Сохранение..."
    );
    try {
        const action =
            type ===
            "turnaround"
                ? "saveTurnaround"
                : "save";
        const response =
            await fetch(
                API_URL,
                {
                    method:
                        "POST",
                    headers: {
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },
                    body:
                        JSON.stringify({
                            action:
                                action,
                            record:
                                record
                        })
                }
            );
        const data =
            await response.json();
        if (!data.ok) {
            throw new Error(
                data.error ||
                "Ошибка сохранения"
            );
        }
        if (
            type ===
            "turnaround"
        ) {
            turnRecords.set(
                String(
                    data.record.id
                ),
                data.record
            );
        }
        else {
            stopRecords.set(
                String(
                    data.record.id
                ),
                data.record
            );
        }
        setSyncStatus(
            "● Сохранено"
        );
        return data.record;
    }
    finally {
        saving =
            false;
        setButtonsDisabled(
            false
        );
    }
}

// ============================================================
// STATS
// ============================================================
function renderStats() {
    let verified =
        0;
    let source =
        0;
    let pending =
        0;
    let problem =
        0;
    const items =
        currentMode ===
        "stops"
            ? allStops
            : allTurns;
    const getStatus =
        currentMode ===
        "stops"
            ? getStopStatus
            : getTurnStatus;
    items.forEach(
        function(item) {
            const status =
                getStatus(item);
            if (
                status ===
                "ПРОВЕРЕНО"
            ) {
                verified++;
            }
            else if (
                status ===
                "ЕСТЬ КООРДИНАТА"
            ) {
                source++;
            }
            else if (
                status ===
                "ПРОБЛЕМА"
            ) {
                problem++;
            }
            else {
                pending++;
            }
        }
    );
    totalCount.textContent =
        items.length;
    verifiedCount.textContent =
        verified;
    sourceCount.textContent =
        source;
    pendingCount.textContent =
        pending;
    problemCount.textContent =
        problem;
}
// ============================================================
// LIST
// ============================================================
function renderList() {
    itemList.innerHTML =
        "";
    const search =
        searchInput.value
        .trim()
        .toLowerCase();
    const filter =
        statusFilter.value;
    if (
        currentMode ===
        "stops"
    ) {
        allStops
        .filter(
            function(stop) {
                const status =
                    getStopStatus(stop);
                if (
                    filter !== "ALL" &&
                    status !== filter
                ) {
                    return false;
                }
                const text =
                    [
                        stop.name || "",
                        (
                            stop.routes ||
                            []
                        ).join(" "),
                        (
                            stop.parks ||
                            []
                        ).join(" ")
                    ]
                    .join(" ")
                    .toLowerCase();
                return (
                    !search ||
                    text.includes(
                        search
                    )
                );
            }
        )
        .forEach(
            renderStopListItem
        );
    }
    else {
        allTurns
        .filter(
            function(turn) {
                const status =
                    getTurnStatus(turn);
                if (
                    filter !== "ALL" &&
                    status !== filter
                ) {
                    return false;
                }
                const text =
                    [
                        turn.route || "",
                        turn.from || "",
                        turn.terminal || "",
                        Array.isArray(
                            turn.parks
                        )
                            ? turn.parks.join(" ")
                            : turn.parks || ""
                    ]
                    .join(" ")
                    .toLowerCase();
                return (
                    !search ||
                    text.includes(
                        search
                    )
                );
            }
        )
        .forEach(
            renderTurnListItem
        );
    }
}

function makeStatusBadge(
    status,
    isTurn
) {
    const badge =
        document.createElement(
            "span"
        );
    badge.className =
        "status";
    if (
        status ===
        "ПРОВЕРЕНО"
    ) {
        badge.classList.add(
            "status-verified"
        );
        badge.textContent =
            "✅ ПРОВЕРЕНО";
    }
    else if (
        status ===
        "ЕСТЬ КООРДИНАТА"
    ) {
        badge.classList.add(
            isTurn
                ? "status-turn-source"
                : "status-source"
        );
        badge.textContent =
            isTurn
                ? "🟣 ЕСТЬ КООРДИНАТА"
                : "🔵 ЕСТЬ КООРДИНАТА";
    }
    else if (
        status ===
        "ПРОБЛЕМА"
    ) {
        badge.classList.add(
            "status-problem"
        );
        badge.textContent =
            "🔴 ПРОБЛЕМА";
    }
    else {
        badge.classList.add(
            "status-pending"
        );
        badge.textContent =
            "⚪ БЕЗ КООРДИНАТ";
    }
    return badge;
}

        document.createElement(

// ============================================================
// SELECT
// ============================================================
function selectStop(id) {
    if (
        currentMode !==
        "stops"
    ) {
        currentMode =
            "stops";
        localStorage.setItem(
            "sma_mode",
            "stops"
        );
        updateModeUI();
    }
    activeStop =
        allStops.find(
            stop =>
                stop.id === id
        ) || null;
    activeTurn =
        null;
    resetCandidate();
    renderStopPanel();
    renderList();
}
function selectTurn(id) {
    if (
        currentMode !==
        "turnarounds"
    ) {
        currentMode =
            "turnarounds";
        localStorage.setItem(
            "sma_mode",
            "turnarounds"
        );
        updateModeUI();
    }
    activeTurn =
        allTurns.find(
            turn =>
                turn.id === id
        ) || null;
    activeStop =
        null;
    resetCandidate();
    renderTurnPanel();
    renderList();
}

    if (!activeTurn) {
        resetPanel();
        return;
    }
    const turn =
        activeTurn;
    const record =
        getTurnRecord(turn);
    const coordinates =
        getTurnCoordinates(turn);
    const displayCoordinates =
        getTurnDisplayCoordinates(turn);
    const status =
        getTurnStatus(turn);
    currentName.textContent =
        "🔄 Разворот маршрута " +
        turn.route;
    setPanelStatus(
        status,
        true
    );
    infoTitle1.textContent =
        "Маршрут";
    infoValue1.textContent =
        turn.route || "—";
    infoTitle2.textContent =
        "Первая точка / отстой";
    infoValue2.textContent =
        turn.from || "—";
    infoTitle3.textContent =
        "Вторая конечная / кандидат";
    infoValue3.textContent =
        turn.terminal ||
        "НУЖНО НАЙТИ";
    sourceLink.href =
        getTurnUrl(turn);
    fillCommonPanel(
        record,
        coordinates,
        record
            ? record.note || ""
            : turn.note || ""
    );
    // Если настоящий разворот неизвестен,
    // карта всё равно приблизится
    // к серой временной точке.
    if (
        !coordinates &&
        displayCoordinates
    ) {
        map.setView(
            [
                displayCoordinates.lat,
                displayCoordinates.lon
            ],
            15
        );
    }
}

// ============================================================
// COMMON PANEL
// ============================================================
function fillCommonPanel(
    record,
    coordinates,
    defaultNote
) {
    coordinateInput.value =
        coordinates
            ? (
                coordinates.lon.toFixed(6)
                +
                ", "
                +
                coordinates.lat.toFixed(6)
            )
            : "";
    noteInput.value =
        record
            ? (
                record.note ||
                defaultNote ||
                ""
            )
            : (
                defaultNote ||
                ""
            );
    lastCheck.textContent =
        record &&
        record.checkedAt
            ? (
                (
                    record.reviewer ||
                    "—"
                )
                +
                " — "
                +
                new Date(
                    record.checkedAt
                )
                .toLocaleString(
                    "ru-RU"
                )
            )
            : "—";
    if (coordinates) {
        map.setView(
            [
                coordinates.lat,
                coordinates.lon
            ],
            17
        );
    }
    clearMessage();
}
// ============================================================
// PARSE COORDINATES
// ============================================================
function parseCoordinates(text) {
    if (!text) {
        return null;
    }
    let value =
        text.trim();
    try {
        value =
            decodeURIComponent(
                value
            );
    }
    catch(error) {
    }
    let match =
        value.match(
            /[?&]m=(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/i
        );
    if (match) {
        const lon =
            Number(match[1]);
        const lat =
            Number(match[2]);
        if (
            validCoordinates(
                lat,
                lon
            )
        ) {
            return {
                lat,
                lon
            };
        }
    }
    match =
        value.match(
            /\/geo\/(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/i
        );
    if (match) {
        const lon =
            Number(match[1]);
        const lat =
            Number(match[2]);
        if (
            validCoordinates(
                lat,
                lon
            )
        ) {
            return {
                lat,
                lon
            };
        }
    }
    match =
        value.match(
            /(-?\d{2,3}(?:\.\d+)?)[,\s;]+(-?\d{2,3}(?:\.\d+)?)/
        );
    if (!match) {
        return null;
    }
    const first =
        Number(match[1]);
    const second =
        Number(match[2]);
    if (
        first >= 75 &&
        first <= 80 &&
        second >= 42 &&
        second <= 45
    ) {
        return {
            lat:
                second,
            lon:
                first
        };
    }
    if (
        first >= 42 &&
        first <= 45 &&
        second >= 75 &&
        second <= 80
    ) {
        return {
            lat:
                first,
            lon:
                second
        };
    }
    return null;
}
// ============================================================
// DISTANCE
// ============================================================
function distanceMeters(
    lat1,
    lon1,
    lat2,
    lon2
) {
    const R =
        6371000;
    const toRad =
        value =>
            value *
            Math.PI /
            180;
    const dLat =
        toRad(
            lat2 - lat1
        );
    const dLon =
        toRad(
            lon2 - lon1
        );
    const a =
        Math.sin(
            dLat / 2
        ) ** 2
        +
        Math.cos(
            toRad(lat1)
        )
        *
        Math.cos(
            toRad(lat2)
        )
        *
        Math.sin(
            dLon / 2
        ) ** 2;
    return (
        R *
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(
                1 - a
            )
        )
    );
}

// CURRENT REAL COORDINATES
// ============================================================
function getCurrentCoordinates() {

// COMPARE
// ============================================================
function compareCandidate(parsed) {
    const existing =
        getCurrentCoordinates();
    compareInfo.style.display =
        "block";
    if (!existing) {
        compareInfo.style.background =
            "#fff4cc";
        compareInfo.style.color =
            "#805b00";
        compareInfo.innerHTML =
            "🟠 Это новая координата.<br>" +
            "Старой координаты для сравнения нет.<br>" +
            "Проверь её в 2ГИС.";
        map.setView(
            [
                parsed.lat,
                parsed.lon
            ],
            18
        );
        return;
    }
    const distance =
        Math.round(
            distanceMeters(
                existing.lat,
                existing.lon,
                parsed.lat,
                parsed.lon
            )
        );
    if (
        distance <= 20
    ) {
        compareInfo.style.background =
            "#dff6e4";
        compareInfo.style.color =
            "#146c2e";
        compareInfo.innerHTML =
            "✅ Координаты практически совпадают.<br>" +
            "Расстояние: " +
            distance +
            " м";
    }
    else if (
        distance <= 50
    ) {
        compareInfo.style.background =
            "#fff4cc";
        compareInfo.style.color =
            "#805b00";
        compareInfo.innerHTML =
            "⚠ Небольшое расхождение.<br>" +
            "Расстояние: " +
            distance +
            " м.<br>" +
            "Проверь визуально.";
    }
    else {
        compareInfo.style.background =
            "#ffe0e0";
        compareInfo.style.color =
            "#9a2424";
        compareInfo.innerHTML =
            "❗ КООРДИНАТЫ НЕ СХОДЯТСЯ.<br>" +
            "Расстояние: " +
            distance +
            " м.<br><br>" +
            "🟠 Новая точка — координата, которую ты проверяешь.";
    }
    map.fitBounds(
        L.latLngBounds([
            [
                existing.lat,
                existing.lon
            ],
            [
                parsed.lat,
                parsed.lon
            ]
        ]),
        {
            padding:
                [70, 70],
            maxZoom:
                18
        }
    );
}

function nextReview() {
    const items =
        currentMode ===
        "stops"
            ? allStops
            : allTurns;
    const getStatus =
        currentMode ===
        "stops"
            ? getStopStatus
            : getTurnStatus;
    const select =
        currentMode ===
        "stops"
            ? selectStop
            : selectTurn;
    const statuses = [
        "ЕСТЬ КООРДИНАТА",
        "НЕ ПРОВЕРЕНО",
        "ПРОБЛЕМА"
    ];
    for (
        const status of statuses
    ) {
        const item =
            items.find(
                element =>
                    getStatus(
                        element
                    ) ===
                    status
            );
        if (item) {
            select(
                item.id
            );
            return;
        }
    }
    showMessage(
        currentMode ===
        "stops"
            ? "Все отстои обработаны 🎉"
            : "Все развороты обработаны 🎉",
        "ok"
    );
